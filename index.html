<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family: "Figtree", sans-serif;

        display: flex;
        flex-direction: column;

        background-color: hsl(47, 88%, 63%);

        min-height: 100vh;
      }

      main {
        flex: 1;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 24px;
      }

      .preview_box {
        width: 100%;
        max-width: 384px;

        padding: 24px;

        background-color: white;

        border: 1px solid black;
        border-radius: 20px;

        box-shadow: 8px 8px 0 black;
      }

      .preview_box > img {
        display: block;

        width: 100%;
        height: auto;

        border-radius: 10px;
      }

      .blog_card {
        text-align: left;
      }

      .blog_status {
        display: flex;
        align-items: center;
        justify-content: center;

        width: fit-content;

        margin: 24px 0 12px;
        padding: 6px 12px;

        font-size: 14px;
        font-weight: 800;

        background-color: hsl(47, 88%, 63%);

        border-radius: 4px;
      }

      .blog_date {
        margin: 0 0 16px;

        font-size: 14px;
        font-weight: 600;
      }

      .blog_card h3 {
        margin: 0 0 16px;

        font-size: 24px;
        line-height: 1.2;

        font-weight: 800;

        color: hsl(0, 0%, 7%);
      }

      .blog_card h3:hover {
        color: hsl(47, 88%, 63%);
        cursor: pointer;
      }

      .blog_description {
        margin: 0 0 24px;

        font-size: 16px;
        line-height: 1.5;

        color: hsl(0, 0%, 42%);
      }

      .blog_author {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .author_pic {
        width: 32px;
        height: 32px;
      }

      .blog_author h6 {
        margin: 0;

        font-size: 14px;
        font-weight: 800;
      }

      footer {
        padding: 10px;

        text-align: center;

        font-size: 11px;
      }

      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      @media (max-width: 375px) {
        main {
          padding: 24px;
        }

        .preview_box {
          max-width: 327px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="preview_box">
        <img
          src="./assets/images/illustration-article.svg"
          alt="Blog article illustration"
        />

        <div class="blog_card">
          <h5 class="blog_status">Learning</h5>

          <p class="blog_date">Published 21 Dec 2023</p>

          <h3>HTML &amp; CSS foundations</h3>

          <p class="blog_description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>

          <div class="blog_author">
            <img
              class="author_pic"
              src="./assets/images/image-avatar.webp"
              alt="Greg Hooper"
            />

            <h6>Greg Hooper</h6>
          </div>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor </a
      >. Coded by <a href="#">Karan Nair</a>.
    </footer>
  </body>
</html>
